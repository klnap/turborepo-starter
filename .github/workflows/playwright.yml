name: Playwright

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover E2E workspaces
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_e2e: ${{ steps.matrix.outputs.has_e2e }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - id: matrix
        name: Build E2E browser matrix
        run: |
          bun scripts/gate/adapters/gh-matrix.ts e2e-browsers > matrix.json
          echo "matrix=$(jq -c '.include' matrix.json)" >> "$GITHUB_OUTPUT"
          echo "has_e2e=$(jq -r '.has' matrix.json)" >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E (${{ matrix.workspace }} / ${{ matrix.browser }})
    needs: discover
    if: needs.discover.outputs.has_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    env:
      SKIP_ENV_VALIDATION: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: "1.4.0"

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright ${{ matrix.browser }}
        run: bun ws ${{ matrix.workspace }} test:e2e:install -- --with-deps ${{ matrix.browser }}

      - name: Build application
        run: bun root build

      - name: Run E2E tests
        run: bun ws ${{ matrix.workspace }} test:e2e -- --project=${{ matrix.browser }}

      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: failure()
        with:
          name: playwright-report-${{ matrix.workspace }}-${{ matrix.browser }}
          path: apps/${{ matrix.workspace }}/.generated/playwright-report/
          retention-days: 7
